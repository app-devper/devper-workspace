name: common
description: Common module project.

version: 1.0.0

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get_it: ^7.1.3
  cupertino_icons: ^1.0.2
  http: ^1.2.1
  logging: ^1.0.2
  intl: any

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  import_sorter: ^4.6.0

publish_to: none

flutter:

  fonts:
    - family: Roboto
      fonts:
        - asset: packages/common/assets/font/roboto_regular.ttf
        - asset: packages/common/assets/font/roboto_bold.ttf
          weight: 700

