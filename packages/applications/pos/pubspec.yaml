name: pos
description: POS Application.

version: 1.5.1

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 2.2.0 needs Dart ^3.12.0; this workspace is pinned to Flutter 3.38.7 (Dart 3.10.7).
  qr_code_scanner_plus: 2.1.2
  # 3.13.0 needs Dart >=3.12.0.
  pdf: ^3.10.7
  path_provider: ^2.0.1
  universal_html: ^2.0.8
  csv: ^8.0.0
  file_picker: ^12.2.0
  shared_preferences:
  intl:
  http:
  common:
  design_system:
  um:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0

publish_to: none

flutter:

  uses-material-design: true

  assets:
    - config/
    - assets/images/logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: packages/common/assets/font/roboto_regular.ttf
        - asset: packages/common/assets/font/roboto_bold.ttf
          weight: 700
    - family: Sarabun
      fonts:
        - asset: packages/common/assets/font/Sarabun-Regular.ttf
          weight: 400
        - asset: packages/common/assets/font/Sarabun-Medium.ttf
          weight: 500
        - asset: packages/common/assets/font/Sarabun-Bold.ttf
          weight: 700
