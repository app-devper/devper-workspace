<body>
<script>
    // Builds before the API gateway migration registered a service worker that
    // still serves the old bundle from cache. The hosting build now ships with
    // --pwa-strategy=none, so unregister any leftover worker and drop its caches
    // to stop returning stale app shells to browsers that visited the old site.
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
            }
        }).catch(function () {});
        if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
                for (var i = 0; i < keys.length; i++) {
                    caches.delete(keys[i]);
                }
            }).catch(function () {});
        }
    }
</script>
<script>
    {{flutter_bootstrap_js}}
</script>
</body>
</html>
