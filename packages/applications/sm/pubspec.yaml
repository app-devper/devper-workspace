name: sm
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http:
  common:
  um:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  import_sorter: ^4.6.0

flutter:
  uses-material-design: true

  assets:
    - config/
    - assets/images/logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: packages/common/font/roboto_regular.ttf
        - asset: packages/common/font/roboto_bold.ttf
          weight: 700
